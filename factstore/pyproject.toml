[project]
name = "factstore"
version = "0.1.0"
description = "A fact store for agents, on Postgres: registered attributes and values, every write a transaction with its actor and evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Zhang" }]
requires-python = ">=3.12"
keywords = ["mcp", "mcp-server", "agents", "postgres", "facts", "provenance", "data-catalogue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = ["psycopg[binary]>=3.2", "mcp>=2.2"]

[project.urls]
Homepage = "https://github.com/Victor-EU/factstore"
Documentation = "https://github.com/Victor-EU/factstore/blob/main/factstore-design.md"
Issues = "https://github.com/Victor-EU/factstore/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
factstore = "factstore.cli:main"
factstore-mcp = "factstore.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The vocabulary packages and their skills, from ../packages and ../factstore-skills: hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "hatch_build.py", "README.md", "LICENSE"]
