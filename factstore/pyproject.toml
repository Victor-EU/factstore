[project]
name = "factstore"
version = "0.1.0.dev0"
description = "The facts component: entities, registered attributes, values and transactions, on Postgres."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "mcp>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
factstore = "factstore.cli:main"
factstore-mcp = "factstore.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# init installs factstore-core, so the wheel carries it; a source checkout reads packages/core.
[tool.hatch.build.targets.wheel.force-include]
"../packages/core" = "factstore/core"
